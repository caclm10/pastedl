<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Rounded square background with premium warm chocolate/brown fill -->
  <rect width="32" height="32" rx="9" fill="#7c4f30"/>
  
  <!-- Left stem of P that extends into a bold downward arrow -->
  <path d="M12 7V25" stroke="#faf9f5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M8 21L12 25L16 21" stroke="#faf9f5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Sleek, organic loop of the 'P' representing clipboard/copy loop -->
  <path d="M12 7H18.5C22 7 22 15 18.5 15H12" stroke="#faf9f5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Minimalist 'data packet' circle representing pasted content -->
  <circle cx="17" cy="11" r="1.75" fill="#e9e6dc"/>
</svg>
